plugins { id 'com.android.application' }
android {
    namespace 'com.radha.music'
    compileSdk 35
    defaultConfig { applicationId 'com.radha.music'; minSdk 26; targetSdk 35; versionCode 10; versionName '1.5.1' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { if (rootProject.file('.local/debug.keystore').exists()) { storeFile rootProject.file('.local/debug.keystore') } } }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty 'maven.repo.local', new File(gradle.gradleUserHomeDir, 'robolectric').absolutePath; systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' } }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
