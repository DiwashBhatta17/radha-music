plugins { id 'com.android.application' }
android {
    namespace 'com.radha.music'
    compileSdk 35
    defaultConfig { applicationId 'com.radha.music'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { if (rootProject.file('.local/debug.keystore').exists()) { storeFile rootProject.file('.local/debug.keystore') } } }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    testImplementation 'junit:junit:4.13.2'
}
